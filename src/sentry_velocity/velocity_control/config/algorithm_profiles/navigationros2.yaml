required_packages:
  - small_point_lio
  - fake_vel_transform
  - pointcloud_segmentation
  - mybringup
  - nav2_map_server
  - nav2_planner
  - nav2_controller
  - nav2_bt_navigator
  - nav2_behaviors

actions:
  # LIO data products are used, but its hard-coded physical TF is isolated.
  - type: node
    package: small_point_lio
    executable: small_point_lio_node
    name: small_point_lio
    delay: 1.5
    parameters:
      - package://small_point_lio/config/mid360_sim.yaml
      - lidar_frame: livox_frame
        save_pcd: false
    remappings:
      - [/tf, /navigationros2/lio_tf]

  # The algorithm expects this virtual planning-frame anchor. The simulator
  # remains the only publisher of odom -> chassis -> base_link.
  - type: node
    package: tf2_ros
    executable: static_transform_publisher
    name: base_link_static_for_navigationros2
    arguments:
      - --x
      - "0"
      - --y
      - "0"
      - --z
      - "0"
      - --roll
      - "0"
      - --pitch
      - "0"
      - --yaw
      - "0"
      - --frame-id
      - base_link
      - --child-frame-id
      - base_link_static

  # Use RViz /initialpose to publish map -> odom; no hard-coded PCD path is used.
  - type: node
    package: mybringup
    executable: initialpose_static_tf_node.py
    name: initialpose_static_tf
    parameters:
      - map_frame: map
        odom_frame: odom
        base_frame: base_link
        initialpose_topic: /initialpose

  - type: include
    launch: package://pointcloud_segmentation/launch/segmentation.launch.py

  # This is the algorithm's own virtual-frame conversion. Its output is already
  # a chassis command, despite the legacy /cmd_vel_gimbal topic name.
  - type: include
    launch: package://fake_vel_transform/launch/fake_vel_transform.launch.py
    launch_arguments:
      use_sim_time: true
      use_fake_vel: true
    remappings:
      - [/cmd_vel_gimbal, /navigation/cmd_vel]

  - type: lifecycle_node
    package: nav2_map_server
    executable: map_server
    name: map_server
    delay: 3.0
    parameters:
      - yaml_filename: {launch_argument: map}

  - type: lifecycle_node
    package: nav2_planner
    executable: planner_server
    name: planner_server
    delay: 3.0
    parameters:
      - package://mybringup/config/costmap2d.yaml
      - package://velocity_control/config/algorithm_profiles/navigationros2_costmap_compat.yaml
      - package://mybringup/config/planner.yaml
      - package://velocity_control/config/algorithm_profiles/navigationros2_planner_compat.yaml
    remappings:
      - [local_costmap/scan, /scan]

  - type: lifecycle_node
    package: nav2_controller
    executable: controller_server
    name: controller_server
    delay: 3.0
    parameters:
      - package://mybringup/config/costmap2d.yaml
      - package://velocity_control/config/algorithm_profiles/navigationros2_costmap_compat.yaml
      - package://mybringup/config/controller.yaml

  - type: lifecycle_node
    package: nav2_bt_navigator
    executable: bt_navigator
    name: bt_navigator
    delay: 3.0
    parameters:
      - package://mybringup/config/nav_bt.yaml
      - package://velocity_control/config/algorithm_profiles/navigationros2_nav_bt_compat.yaml
      - default_nav_to_pose_bt_xml: package://mybringup/config/my_nav_to_pose_bt.xml
        default_nav_through_poses_bt_xml: package://mybringup/config/my_nav_through_poses_bt.xml

  - type: lifecycle_node
    package: nav2_behaviors
    executable: behavior_server
    name: behavior_server
    delay: 3.0
    parameters:
      - package://mybringup/config/nav_bt.yaml
      - package://velocity_control/config/algorithm_profiles/navigationros2_nav_bt_compat.yaml

  - type: node
    package: nav2_lifecycle_manager
    executable: lifecycle_manager
    name: lifecycle_manager
    delay: 4.0
    parameters:
      - autostart: true
        node_names: [map_server, controller_server, planner_server, bt_navigator, behavior_server]

  - type: node
    package: rviz2
    executable: rviz2
    name: rviz2
    arguments:
      - -d
      - package://mybringup/rviz/nav.rviz
