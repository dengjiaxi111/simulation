required_packages:
  - small_point_lio
  - fake_vel_transform
  - pointcloud_segmentation
  - mybringup
  - nav2_map_server
  - nav2_planner
  - nav2_controller
  - nav2_bt_navigator
  - nav2_behaviors
  - nav2_lifecycle_manager
  - rviz2

actions:
  # LIO owns odom -> base_link and consumes the simulated Livox topics.
  - type: node
    package: velocity_control
    executable: lio_after_tf.py
    name: small_point_lio
    delay: 1.5
    parameters:
      - lio_params_file: package://small_point_lio/config/mid360_sim.yaml
      - lidar_frame: livox_frame
        base_frame: base_link
        # save_pcd remains owned by mid360_sim.yaml and the algorithm.

  # Keep map available before localization with an identity map->odom.  The
  # first RViz /initialpose updates that transform and then enables navigation.
  - type: node
    package: velocity_control
    executable: navigation_initialpose_gate.py
    name: navigation_initialpose_gate
    parameters:
      - map_frame: map
        odom_frame: odom
        base_frame: base_link
        initialpose_topic: /initialpose

  - type: include
    launch: package://pointcloud_segmentation/launch/segmentation.launch.py

  # This is the algorithm's own virtual-frame conversion. Its output is already
  # a chassis command, despite the legacy /cmd_vel_gimbal topic name.
  - type: include
    launch: package://fake_vel_transform/launch/fake_vel_transform.launch.py
    launch_arguments:
      use_sim_time: true
      use_fake_vel: true
    remappings:
      - [/cmd_vel_gimbal, /navigation/cmd_vel]

  - type: lifecycle_node
    package: nav2_map_server
    executable: map_server
    name: map_server
    # Keep the static map independent and self-healing.  If the first
    # map_server process loses DDS discovery during a stale-process cleanup,
    # launch_ros recreates it and the dedicated lifecycle manager activates it.
    respawn: true
    respawn_delay: 2.0
    parameters:
      - yaml_filename: package://mybringup/map/RMUC.yaml

  # Activate the static map independently.  Planner/controller startup must
  # never be able to hold /map in the inactive lifecycle state.
  - type: node
    package: nav2_lifecycle_manager
    executable: lifecycle_manager
    name: map_lifecycle_manager
    delay: 0.5
    parameters:
      - autostart: true
      - node_names: [map_server]

  - type: lifecycle_node
    package: nav2_planner
    executable: planner_server
    name: planner_server
    delay: 3.0
    parameters:
      - package://mybringup/config/costmap2d.yaml
      - package://velocity_control/config/algorithm_profiles/navigationros2_costmap_compat.yaml
      - package://mybringup/config/planner.yaml
      - package://velocity_control/config/algorithm_profiles/navigationros2_planner_compat.yaml
    remappings:
      - [local_costmap/scan, /scan]

  - type: lifecycle_node
    package: nav2_controller
    executable: controller_server
    name: controller_server
    delay: 3.0
    parameters:
      - package://mybringup/config/costmap2d.yaml
      - package://velocity_control/config/algorithm_profiles/navigationros2_costmap_compat.yaml
      - package://mybringup/config/controller.yaml

  - type: lifecycle_node
    package: nav2_bt_navigator
    executable: bt_navigator
    name: bt_navigator
    delay: 3.0
    parameters:
      - package://mybringup/config/nav_bt.yaml
      - package://velocity_control/config/algorithm_profiles/navigationros2_nav_bt_compat.yaml
      - default_nav_to_pose_bt_xml: package://mybringup/config/my_nav_to_pose_bt.xml
        default_nav_through_poses_bt_xml: package://mybringup/config/my_nav_through_poses_bt.xml

  - type: lifecycle_node
    package: nav2_behaviors
    executable: behavior_server
    name: behavior_server
    delay: 3.0
    parameters:
      - package://mybringup/config/nav_bt.yaml
      - package://velocity_control/config/algorithm_profiles/navigationros2_nav_bt_compat.yaml

  - type: node
    package: nav2_lifecycle_manager
    executable: lifecycle_manager
    name: navigation_lifecycle_manager
    delay: 5.0
    parameters:
      - autostart: true
      - node_names: [controller_server, planner_server, bt_navigator, behavior_server]

  - type: node
    package: velocity_control
    executable: rviz_after_map.py
    name: rviz_after_map
    parameters:
      - map_topic: /map
        rviz_config: package://velocity_control/config/navigationros2_sim.rviz
