# ROS 2 Jazzy pluginlib class-name compatibility overrides.
bt_navigator:
  ros__parameters:
    # Jazzy loads Nav2's standard BT node libraries itself.  Listing the old
    # standard libraries again registers actions such as ComputePathToPose
    # twice; only the algorithm's custom library must be added explicitly.
    plugin_lib_names: ["my_nav2_bt"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

behavior_server:
  ros__parameters:
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
