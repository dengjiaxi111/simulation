controller_manager:
  ros__parameters:
    update_rate: 100


    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


    velocity_controller:
      type: velocity_control/VelocityController

velocity_controller:
  ros__parameters:
    left_wheel_name: "left_wheel_joint"
    right_wheel_name: "right_wheel_joint"
    caster_wheel_name: "caster_wheel_joint"
    wheel_separation: 0.58
    wheel_radius: 0.08
    left_wheel_pid_p: 10.0
    left_wheel_pid_i: 0.0
    left_wheel_pid_d: 0.0
    right_wheel_pid_p: 10.0
    right_wheel_pid_i: 0.0
    right_wheel_pid_d: 0.0
    # optional torque limiting (controller should honor these if implemented)
    left_wheel_max_effort: 30.0
    right_wheel_max_effort: 30.0
    # limit controller output (anti-windup) - tune as needed
    left_wheel_output_limit: 0.8
    right_wheel_output_limit: 0.8
