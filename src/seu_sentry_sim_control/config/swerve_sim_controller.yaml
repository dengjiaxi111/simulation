swerve_sim_controller:
  ros__parameters:
    command_topic: /cmd_vel_chassis
    joint_state_topic: /joint_states
    control_rate: 100.0
    command_timeout: 0.2
    command_deadband: 0.0001
    wheel_radius: 0.0535
    max_wheel_angular_speed: 50.0

    # Module centers in the SDF chassis frame (the source CAD frame).
    module_x: [-0.159, 0.159, -0.159, 0.159]
    module_y: [-0.159, -0.159, 0.159, 0.159]
    steer_joint_names:
      [front_left_steer_joint, front_right_steer_joint,
       rear_left_steer_joint, rear_right_steer_joint]
    wheel_joint_names:
      [front_left_wheel_joint, front_right_wheel_joint,
       rear_left_wheel_joint, rear_right_wheel_joint]

    # physical_direction = raw_joint_angle + steer_zero_offset in the SDF frame.
    steer_direction_signs: [1.0, 1.0, 1.0, 1.0]
    steer_zero_offsets: [-0.785398, 0.785398, -2.356194, 2.356194]
    drive_signs: [1.0, 1.0, 1.0, 1.0]
